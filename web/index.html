<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TinyGPT — chat</title>
<link rel="stylesheet" href="chat.css" />
<style>
  body {
    margin: 0 auto;
    padding: 2rem 1.25rem;
    max-width: 46rem;
    font-family: Georgia, serif;
    line-height: 1.6;
    color: #18181a;
    background: #faf9f6;
  }
  h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }
  p.lede { color: #5e5e65; margin-top: 0; }
  @media (prefers-color-scheme: dark) {
    body { color: #ededea; background: #16161a; }
    p.lede { color: #a8a8ae; }
  }
</style>
</head>
<body>
<h1>TinyGPT</h1>
<p class="lede">A character-level transformer running entirely in this tab. No server.</p>

<div class="tg">
  <div class="tg-log" role="log" aria-live="polite"></div>
  <form class="tg-form">
    <input type="text" placeholder="say something…" autocomplete="off" aria-label="Your message" disabled />
    <button type="submit" disabled>Send</button>
  </form>
  <div class="tg-controls">
    <label>temperature
      <input type="range" name="temperature" min="0.3" max="1.3" step="0.05" value="0.8" />
      <span class="tg-temp-value">0.80</span>
    </label>
    <span class="tg-status">starting…</span>
  </div>
</div>

<script type="module">
  import { mount } from './chat.js';
  mount(document.querySelector('.tg'), '.');
</script>
</body>
</html>
